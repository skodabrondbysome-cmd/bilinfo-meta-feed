name: Update Meta vehicle feed from Bilinfo

on:
  schedule:
    - cron: "15 4 * * *"   # daily 04:15 UTC (05:15/06:15 Danish time), before Meta's fetch
  workflow_dispatch:        # "Run workflow" button for manual runs
    inputs:
      test_mode:
        description: "Test run: ignore the 10-car minimum, show the result, do NOT update the feed"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: meta-feed
  cancel-in-progress: false

jobs:
  build-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Build feed from Bilinfo
        if: ${{ !inputs.test_mode }}
        env:
          BILINFO_USER: ${{ secrets.BILINFO_USER }}
          BILINFO_PASSWORD: ${{ secrets.BILINFO_PASSWORD }}
        run: python bilinfo_to_meta_feed.py --out meta_vehicle_feed.csv

      - name: Test run (feed file is not touched)
        if: ${{ inputs.test_mode }}
        env:
          BILINFO_USER: ${{ secrets.BILINFO_USER }}
          BILINFO_PASSWORD: ${{ secrets.BILINFO_PASSWORD }}
        run: |
          python bilinfo_to_meta_feed.py --out test_feed.csv --min-vehicles 1
          echo "----- test_feed.csv -----"
          cat test_feed.csv

      - name: Attach test result to the run
        if: ${{ inputs.test_mode }}
        uses: actions/upload-artifact@v4
        with:
          name: test-feed
          path: test_feed.csv
          retention-days: 3

      - name: Commit feed if it changed
        if: ${{ !inputs.test_mode }}
        run: |
          git config user.name  "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add meta_vehicle_feed.csv
          if git diff --cached --quiet; then
            echo "No stock changes today."
          else
            git commit -m "Update vehicle feed $(date -u +%F)"
            git push
          fi
